{% extends "base.html" %}
{% block content %}
<h2>Alerts</h2>
<div class="card filters">
  <label>Min severity <select id="fSev"><option value="low">Low (all)</option><option value="medium" selected>Medium+</option><option value="high">High+</option><option value="critical">Critical</option></select></label>
  <label>Status <select id="fStatus"><option value="">Any</option><option value="open" selected>Open</option><option value="acknowledged">Acknowledged</option></select></label>
  <label>Window <select id="fDays"><option value="7">7 days</option><option value="14" selected>14 days</option><option value="30">30 days</option><option value="">All</option></select></label>
</div>
<div id="alertList" class="alist"></div>
{% endblock %}
{% block scripts %}
<script>
const load = () => {
  const p = new URLSearchParams({severity: fSev.value, status: fStatus.value, days: fDays.value});
  fetch('/api/alerts?' + p).then(r => r.json()).then(a => renderAlerts(document.getElementById('alertList'), a, false, load));
};
['fSev', 'fStatus', 'fDays'].forEach(id => document.getElementById(id).addEventListener('change', load));
load();
</script>
{% endblock %}
