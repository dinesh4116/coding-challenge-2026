<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Campaign Anomaly Detector{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head><body>
<nav class="nav"><a class="brand" href="/">&#9889; AnomalyWatch</a>
  <div class="links">
    <a href="/dashboard">Dashboard</a><a href="/campaigns">Campaigns</a>
    <a href="/alerts">Alerts</a><a href="/upload">Upload</a>
  </div></nav>
<main class="wrap">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
<script src="{{ url_for('static', filename='js/alerts.js') }}"></script>
{% block scripts %}{% endblock %}
</body></html>
